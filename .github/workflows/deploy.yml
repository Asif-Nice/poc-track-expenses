name: Deploy to GitHub Pages

# Every expense you add, edit, or delete commits data/expenses.xlsx to this
# repository, which lands here and republishes the site with the updated file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step — the app is plain HTML/CSS/JS with SheetJS vendored in,
      # and data/expenses.xlsx ships with it so the page can be read without a
      # token. Note this repo is public, so that file is public too.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
