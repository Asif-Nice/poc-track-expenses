name: Deploy to GitHub Pages

# Publishes the app itself. Expense edits commit to the private data repo, not
# here, so day-to-day use does not trigger a deploy — only code changes do.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step — the app is plain HTML/CSS/JS with SheetJS vendored in.
      # This repository holds app code only. The workbook lives in a separate
      # private repo (see assets/config.js) and is fetched at runtime with the
      # user's token, so nothing published here contains expense data.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
